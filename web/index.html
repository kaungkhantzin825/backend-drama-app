<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="MyanCash - Watch videos and earn real rewards">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MyanCash">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MyanCash</title>
  <link rel="manifest" href="manifest.json">

  <!--
    The episode player embeds YouTube in an iframe. It is display-only: every
    tap and swipe must reach Flutter (tap-to-pause, the Share/Save/EP rail,
    swipe to the next episode). Without this, clicks land inside the iframe,
    YouTube pauses itself and draws its own big play/pause icon, and the
    Flutter buttons drawn over it never fire.
  -->
  <style>
    iframe { pointer-events: none !important; }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
