name: dramaloop
description: "DramaLoop — vertical short-drama streaming with rewards."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Networking
  dio: ^5.4.3

  # Local storage (auth token + stable device id)
  shared_preferences: ^2.2.3

  # Episode playback (HLS / MP4)
  video_player: ^2.8.6

  # YouTube-backed demo episodes (iframe on web, webview on mobile)
  youtube_player_iframe: ^5.2.0

  # Native share sheet for drama links
  share_plus: ^10.0.2

  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.3
  applovin_max: ^4.6.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/logo/
